group = "dev.localstudy.formula"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace "dev.localstudy.formula"
    compileSdk 36
    ndkVersion "28.2.13676358"
    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "../src/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
