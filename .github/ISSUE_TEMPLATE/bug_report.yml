name: 问题反馈 (Bug Report)
description: 反馈在使用 Quelyt 过程中遇到的异常、崩溃或界面问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows x64
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.3.0-dev+33
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 所属模块
      options:
        - 资料库与导入
        - 阅读器与 OCR
        - 教材问答与联网搜索
        - 独立笔记
        - 复习系统 (FSRS / 专题)
        - 日程与 AI 排课
        - 设置与凭据
        - 其他
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期表现与实际表现
      placeholder: 请简述期望行为与实际发生的结果；涉及 AI 问题时请勿粘贴 API Key 等敏感信息。
    validations:
      required: true
